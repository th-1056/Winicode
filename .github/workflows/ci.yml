name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.402
      - name: Static packaging checks and Unicode hashes
        run: ./scripts/test-packaging.ps1
      - name: Build application and execute console regression tests
        run: ./scripts/build.ps1
      - name: Audit public source allowlist
        run: ./scripts/export-source.ps1 -ListOnly
